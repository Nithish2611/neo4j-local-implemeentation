[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-graph"
version = "0.1.0"
description = "Local code-graph RAG: tree-sitter -> Neo4j -> LLM assistant (Python, JavaScript, PHP)"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20,<7",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-php>=0.23",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
ui = ["streamlit"]

[project.scripts]
cognitive-graph = "cognitive_graph.cli:main"

[tool.setuptools]
packages = ["cognitive_graph"]
